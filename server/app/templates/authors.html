{% extends "base.html" %}
{% block title %}Authors · ScrewXBookmarks{% endblock %}
{% block main %}
<form method="get"><input type="search" name="q" value="{{ q }}" placeholder="Filter authors…"></form>
{% if not authors %}
  <p class="muted">{% if q %}No authors match “{{ q }}”.{% else %}Nothing indexed yet — check the <a href="/sync">sync page</a>.{% endif %}</p>
{% endif %}
<div class="folders">{% include "_folders.html" %}</div>
{% endblock %}
