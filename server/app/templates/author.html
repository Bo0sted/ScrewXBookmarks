{% extends "base.html" %}
{% block title %}@{{ a.handle }} · ScrewXBookmarks{% endblock %}
{% block main %}
<div class="profile">
  {% if a.avatar_file %}<img class="avatar big" src="/thumb/s/avatars/{{ a.avatar_file }}" alt="">{% else %}<span class="avatar big"></span>{% endif %}
  <div>
    <h1>{{ a.name }}</h1>
    <div class="muted">
      <a href="https://x.com/{{ a.handle }}" target="_blank" rel="noopener">@{{ a.handle }}</a>
      · id <a href="https://x.com/i/user/{{ a.id }}" target="_blank" rel="noopener" title="Works even if they change their handle">{{ a.id }}</a>
      · {{ total }} reposted
    </div>
  </div>
  <button class="tag-user-btn" data-tagger="authors" data-id="{{ a.id }}" data-label="@{{ a.handle }}">🏷 Tag</button>
</div>
<div class="feed">{% include "_feed.html" %}</div>
{% endblock %}
